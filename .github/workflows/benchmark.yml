name: Benchmark
on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'JMH threads for closed/open benchmarks (-t); keep <= runner vCPU count'
        required: true
        default: '4'
      group_threads:
        description: 'JMH thread distribution for half-open groups (-tg), opener,prober'
        required: true
        default: '1,3'
      extra_args:
        description: 'Extra JMH arguments, e.g. "-f 1 -wi 3 -i 5" for a quick run'
        required: false
        default: ''

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        benchmark: [ SyncVsFailsafeBenchmark, LockFreeVsResilience4jBenchmark ]
        profiler: [ none, gc ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install library modules
        run: mvn -B -q install -DskipTests -Dgpg.skip=true

      - name: Build benchmarks jar
        run: mvn -B -q -f circuit-breaker-benchmark/pom.xml package

      - name: Record runner hardware
        run: |
          lscpu | tee hardware.txt
          echo "nproc: $(nproc)" | tee -a hardware.txt
          java -version 2>&1 | tee -a hardware.txt

      - name: Run ${{ matrix.benchmark }} (profiler ${{ matrix.profiler }})
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          PROFILER: ${{ matrix.profiler }}
          THREADS: ${{ inputs.threads }}
          GROUP_THREADS: ${{ inputs.group_threads }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          PROF_ARGS=""
          if [ "$PROFILER" != "none" ]; then
            PROF_ARGS="-prof $PROFILER"
          fi
          java -jar circuit-breaker-benchmark/target/benchmarks.jar "$BENCHMARK" \
              -t "$THREADS" -tg "$GROUP_THREADS" $PROF_ARGS $EXTRA_ARGS \
              -rf json -rff result.json | tee result.txt

      - name: Publish summary
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          PROFILER: ${{ matrix.profiler }}
        run: |
          {
            echo "### $BENCHMARK (profiler: $PROFILER)"
            echo
            echo "CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p'), nproc: $(nproc)"
            echo
            echo '```'
            sed -n '/^Benchmark  /,/^$/p' result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.benchmark }}-${{ matrix.profiler }}
          path: |
            result.json
            result.txt
            hardware.txt
